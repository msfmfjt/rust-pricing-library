[workspace]
members = [
    "crates/pricing-core",
    "crates/pricing-numerics",
    "crates/pricing-aad",
    "crates/pricing-market",
    "crates/pricing-product",
    "crates/pricing-models",
    "crates/pricing-mc",
    "crates/pricing-risk",
    "crates/pricing",
    "crates/pricing-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Masafumi Fujita"]
repository = "https://github.com/msfmfjt/rust-pricing-library"

[workspace.dependencies]
pricing-core = { path = "crates/pricing-core" }
pricing-numerics = { path = "crates/pricing-numerics" }
pricing-aad = { path = "crates/pricing-aad" }
pricing-market = { path = "crates/pricing-market" }
pricing-product = { path = "crates/pricing-product" }
pricing-models = { path = "crates/pricing-models" }
pricing-mc = { path = "crates/pricing-mc" }
pricing-risk = { path = "crates/pricing-risk" }
pricing = { path = "crates/pricing" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
