[workspace]
members = [
    "crates/pricing-numerics",
    "crates/pricing",
    "crates/pricing-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Masafumi Fujita"]
repository = "https://github.com/msfmfjt/rust-pricing-library"

[workspace.dependencies]
pricing-numerics = { version = "0.1.0", path = "crates/pricing-numerics" }
pricing = { version = "0.1.0", path = "crates/pricing" }
blake3 = "1.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
rayon = "1.11.0"
pyo3 = "0.29.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
