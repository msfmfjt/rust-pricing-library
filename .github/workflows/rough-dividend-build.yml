name: Rough stochastic-dividend price validation
on:
  push:
    branches: [work/rough-stochastic-dividends-20260924]
    paths: [.github/workflows/rough-dividend-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct fixture types and retain exact source
        run: |
          test "$(git rev-parse HEAD^)" = e457aeedc7e9687c7df976c9afe76735efe10eca
          python - <<'PY'
          from pathlib import Path
          changes = {
              'crates/pricing/tests/rough_dividends.rs': [
                  ('let times = [0.0, 0.13, 0.5, 1.0];', 'let times: [f64; 4] = [0.0, 0.13, 0.5, 1.0];'),
                  ('for j in 0..i - 1 {', 'for (j, &past_dw) in dw.iter().enumerate().take(i - 1) {'),
                  ('x += w * dw[j];', 'x += w * past_dw;')],
              'crates/pricing/src/engine/processes/stochastic_dividends/rough.rs': [
                  ('for i in 1..times.len() {', 'for (i, &time) in times.iter().enumerate().skip(1) {'),
                  ('k.variances[i] < times[i].powf(2.0 * h)', 'k.variances[i] < time.powf(2.0 * h)')]
          }
          for name, replacements in changes.items():
              p = Path(name)
              s = p.read_text()
              for old, new in replacements:
                  assert s.count(old) == 1, (name, old)
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          git rm .github/workflows/rough-dividend-build.yml
          cargo fmt --all
          git add -u
          test "$(git write-tree)" = 22c6f184f3595b9008138089072b391090ea12e6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: clarify rough reference float types and iterate basis rows'
          mkdir -p /tmp/rough-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/rough-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/rough-evidence/source.tar.gz HEAD
          git push origin HEAD:refs/heads/work/rough-stochastic-dividends-20260924
      - name: Formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/rough-evidence/clippy.log
      - name: Joint covariance and public rough-dividend tests
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::rough -- --nocapture 2>&1 | tee /tmp/rough-evidence/covariance.log
          cargo test --locked --release -p pricing --test rough_dividends -- --nocapture 2>&1 | tee /tmp/rough-evidence/rough-pricing.log
          cargo test --locked --release -p pricing --test stochastic_dividends --test bergomi_dividends --test stochastic_dividend_risk --test stochastic_dividend_bergomi_risk --test stochastic_dividend_correlation_risk --test stochastic_dividend_gamma 2>&1 | tee /tmp/rough-evidence/regression.log
      - name: Python wheel and all Python tests
        run: |
          python -m pip install 'maturin>=1.9,<2' 'numpy>=2,<3'
          python -m maturin build --locked --release --out /tmp/rough-wheels
          python -m pip install --force-reinstall /tmp/rough-wheels/*.whl
          python -m unittest discover -s tests/python -p test_rough_dividends.py -v 2>&1 | tee /tmp/rough-evidence/python-rough.log
          python examples/python/rough_dividends.py 2>&1 | tee /tmp/rough-evidence/example.log
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/rough-evidence/python-all.log
      - name: Source and documentation contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/rough-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Ordinary release Rust suites
        run: |
          cargo test --locked --release --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/rough-evidence/rust-all.log
          cargo test --locked --release -p pricing-python 2>&1 | tee /tmp/rough-evidence/rust-bindings.log
          cargo test --locked --release -p pricing --no-default-features 2>&1 | tee /tmp/rough-evidence/rust-minimal.log
      - name: Retain exact source and observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-stochastic-dividend-candidate
          path: /tmp/rough-evidence
          retention-days: 14
          if-no-files-found: warn
