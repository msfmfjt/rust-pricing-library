name: Heston Fourier Hurst risk

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/hurst-risk.json'
      - 'scripts/*heston_hurst_risk*.py'
      - 'scripts/smoke_test_wheel.py'
      - 'scripts/check_source_archive.py'
      - 'tests/python/test_heston_hurst_risk.py'
      - 'examples/python/heston_hurst_risk.py'
      - 'docs/models/heston-hurst-risk.md'
      - 'design/validation/heston-hurst-risk.md'
      - 'rust_pricing.pyi'
      - '.github/workflows/heston-hurst-risk.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: heston-hurst-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'mpmath>=1.3,<2'
      - name: Check independent Hurst references and evidence contracts
        run: |
          python scripts/check_heston_hurst_risk.py
          python -m unittest discover -s scripts -p 'test_heston_hurst_risk_reference.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check Hurst tangent contracts
        run: cargo test --locked -p pricing --test heston_hurst_risk
      - name: Check differentiated kernel and digamma
        run: |
          cargo test --locked -p pricing --lib hurst
          cargo test --locked -p pricing-numerics
      - name: Check minimal build
        run: cargo test --locked --no-default-features -p pricing --test heston_hurst_risk
      - name: Check independent derivatives and refinement in release
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_hurst_risk -- --include-ignored --nocapture
          } 2>&1 | tee heston-hurst-risk.log
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-hurst-risk-${{ matrix.os }}
          path: heston-hurst-risk.log
          retention-days: 14
          if-no-files-found: error
