name: Stochastic dividend Bergomi parameter risk validation
on:
  push:
    branches: [work/stochastic-dividend-bergomi-risk-20260924]
    paths: [.github/workflows/stochastic-dividend-bergomi-risk-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and format verified candidate on scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 30ce1f2cae0974b075e5099415735b7a927df797
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = []
          for sha in ['0d48935638f716a9492c9774509c76eddbc4ac79', '0a01cb2b4fae1e13fd1fceec4044e87e020d5f70']:
              url = 'https://api.github.com/repos/msfmfjt/rust-pricing-library/git/blobs/' + sha
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  parts.append(base64.b64decode(json.load(response)['content']))
          patch = lzma.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5d71aa7c04e62e5a48a611eb063272f82c04335b0e1dd3cb4e4586bab25266ee'
          pathlib.Path('/tmp/model-risk.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --index /tmp/model-risk.patch
          git rm .github/workflows/stochastic-dividend-bergomi-risk-build.yml
          test "$(git write-tree)" = f0c00c103d4ee0d5ee2486e82d5961dcde361ff3
          cargo fmt --all
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: materialize formatted stochastic-dividend Bergomi parameter risk'
          mkdir -p /tmp/model-risk-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/model-risk-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/model-risk-evidence/source.tar.gz HEAD
          git push origin HEAD:refs/heads/work/stochastic-dividend-bergomi-risk-20260924
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/model-risk-evidence/clippy.log
      - name: Focused model and basic risk tests
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::bergomi::parameter_reverse -- --nocapture 2>&1 | tee /tmp/model-risk-evidence/coefficients.log
          cargo test --locked --release -p pricing --test stochastic_dividend_bergomi_risk -- --nocapture 2>&1 | tee /tmp/model-risk-evidence/model-risk.log
          cargo test --locked --release -p pricing --test stochastic_dividend_risk --test stochastic_dividends --test bergomi_dividends 2>&1 | tee /tmp/model-risk-evidence/regression.log
      - name: Wheel and Python checks
        run: |
          python -m pip install 'maturin>=1.9,<2' 'numpy>=2,<3'
          python -m maturin build --locked --release --out /tmp/model-risk-wheels
          python -m pip install --force-reinstall /tmp/model-risk-wheels/*.whl
          python -m unittest discover -s tests/python -p 'test_stochastic_dividend*py' -v 2>&1 | tee /tmp/model-risk-evidence/python-risk.log
          python -m unittest discover -s tests/python -p test_bergomi_dividends.py -v
          python examples/python/stochastic_dividend_bergomi_risk.py 2>&1 | tee /tmp/model-risk-evidence/example.log
      - name: Source contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/model-risk-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: All normal Rust tests
        run: |
          cargo test --locked --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/model-risk-evidence/rust-all.log
          cargo test --locked -p pricing-python 2>&1 | tee /tmp/model-risk-evidence/bindings.log
          cargo test --locked -p pricing --no-default-features 2>&1 | tee /tmp/model-risk-evidence/rust-minimal.log
      - name: Full Python tests
        run: python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/model-risk-evidence/python-all.log
      - name: Retain source and observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-dividend-bergomi-risk-candidate
          path: /tmp/model-risk-evidence
          retention-days: 14
          if-no-files-found: warn
