name: Rough family LSV Spot Delta

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'rust_pricing.pyi'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - 'scripts/test_rough_family_lsv_spot_contract.py'
      - 'tests/python/test_rough_family_lsv_spot_delta.py'
      - 'examples/python/rough_family_lsv_spot_delta.py'
      - 'docs/models/rough-family-lsv-spot-delta.md'
      - 'design/validation/rough-family-lsv-spot-delta.md'
      - '.github/workflows/rough-family-lsv-spot-delta.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rough-family-lsv-spot-delta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_rough_family_lsv_spot_contract.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p pricing --test rough_family_lsv_spot_delta
      - run: cargo test --locked --no-default-features -p pricing --test rough_family_lsv_spot_delta
      - name: Check both Spot conventions and independent Black limits
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test rough_family_lsv_spot_delta -- --include-ignored --nocapture
          } 2>&1 | tee rough-family-lsv-spot-delta.log
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-family-lsv-spot-delta-${{ matrix.os }}
          path: rough-family-lsv-spot-delta.log
          retention-days: 14
          if-no-files-found: error
