name: Bergomi stochastic-dividend candidate validation
on:
  push:
    branches: [work/bergomi-dividend-validation-20260924]
    paths: [.github/workflows/bergomi-dividend-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified lint correction and remove scratch workflow
        run: |
          test "$(git rev-parse HEAD^)" = 2e4b97809e20305bcdd0307e0498d14778d08335
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/pricing/src/engine/processes/stochastic_dividends/bergomi.rs')
          s = p.read_text()
          old = '            for j in 0..D {\n                lower[i][j] = marginal.variance.sqrt() * factor.lower()[(i + 2) * D + j];\n            }'
          new = '            for (j, value) in lower[i].iter_mut().enumerate() {\n                *value = marginal.variance.sqrt() * factor.lower()[(i + 2) * D + j];\n            }'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('crates/pricing/src/engine/risk/stochastic_dividends.rs')
          s = p.read_text()
          old = '/// Constant volatility of the normalized residual-equity martingale, with a\n/// stochastic cash reserve. It is not Black-Scholes volatility of physical S.'
          new = '/// Constant-volatility or pure Bergomi residual equity with a stochastic cash\n/// reserve. The request volatility is the initial residual-equity volatility,\n/// not physical-stock implied volatility. This plan exposes prices only.'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/bergomi-dividend-validation.yml
          cargo fmt --all
          git add -u
          test "$(git write-tree)" = 1332a2aa5d5e9e2738c1637ab03261d575358b8c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: iterate typed OU coefficient row and clarify pricing documentation'
          git push origin HEAD:refs/heads/work/bergomi-dividend-validation-20260924
          mkdir -p /tmp/bergomi-dividend-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/bergomi-dividend-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/bergomi-dividend-evidence/source.tar.gz HEAD
      - name: Clippy all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/bergomi-dividend-evidence/clippy.log
      - name: Focused Rust stochastic-dividend tests
        run: |
          cargo test --locked -p pricing --lib engine::processes::stochastic_dividends::bergomi -- --nocapture 2>&1 | tee /tmp/bergomi-dividend-evidence/covariance.log
          cargo test --locked -p pricing --test bergomi_dividends -- --nocapture 2>&1 | tee /tmp/bergomi-dividend-evidence/bergomi.log
          cargo test --locked -p pricing --test stochastic_dividends -- --nocapture 2>&1 | tee /tmp/bergomi-dividend-evidence/bs-dividends.log
      - name: Build wheel and focused Python verification
        run: |
          python -m pip install 'maturin>=1.9,<2.0' 'numpy>=2.0,<3.0'
          python -m maturin build --locked --release --out /tmp/bergomi-wheels
          python -m pip install --force-reinstall /tmp/bergomi-wheels/*.whl
          python -m unittest discover -s tests/python -p test_bergomi_dividends.py -v 2>&1 | tee /tmp/bergomi-dividend-evidence/bergomi-python.log
          python -m unittest discover -s tests/python -p test_stochastic_dividends.py -v 2>&1 | tee /tmp/bergomi-dividend-evidence/bs-python.log
          python examples/python/bergomi_dividends.py 2>&1 | tee /tmp/bergomi-dividend-evidence/example.log
          python examples/python/stochastic_dividends.py
      - name: Documentation and source contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/bergomi-dividend-evidence/source.tar.gz
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Full normal Rust suites
        run: |
          cargo test --locked --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/bergomi-dividend-evidence/rust-all.log
          cargo test --locked -p pricing-python 2>&1 | tee /tmp/bergomi-dividend-evidence/bindings-rust.log
          cargo test --locked -p pricing --no-default-features 2>&1 | tee /tmp/bergomi-dividend-evidence/rust-minimal.log
      - name: Full Python suite
        run: python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/bergomi-dividend-evidence/python-all.log
      - name: Retain candidate and observed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bergomi-stochastic-dividend-native-candidate
          path: /tmp/bergomi-dividend-evidence
          retention-days: 14
          if-no-files-found: warn
