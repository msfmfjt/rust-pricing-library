name: Heston IV holdout validation

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/**'
      - 'scripts/*heston*py'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - 'tests/python/test_heston_iv_holdout.py'
      - 'examples/python/heston_iv_holdout.py'
      - 'docs/models/heston-iv-holdout.md'
      - 'design/validation/heston-iv-holdout.md'
      - 'rust_pricing.pyi'
      - '.github/workflows/heston-iv-holdout.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: heston-iv-holdout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'mpmath>=1.3,<2'
      - name: Check independent holdout references and safeguards
        run: |
          python scripts/check_heston_iv_holdout.py
          python -m unittest discover -s scripts -p 'test_heston_iv_holdout_protocol.py'
          python -m unittest discover -s scripts -p 'test_heston_iv_refinement_protocol.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p pricing --test heston_iv_holdout
      - run: cargo test --locked --no-default-features -p pricing --test heston_iv_holdout
      - name: Execute disjoint holdout panels in release
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_iv_holdout -- --include-ignored --nocapture
          } 2>&1 | tee heston-iv-holdout.log
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-iv-holdout-${{ matrix.os }}
          path: heston-iv-holdout.log
          retention-days: 14
          if-no-files-found: error
