name: Heston Fourier

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'crates/**'
      - 'rust_pricing.pyi'
      - 'fixtures/rough-volatility/fourier.json'
      - 'scripts/*heston_fourier*.py'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - 'tests/python/test_heston_fourier.py'
      - 'examples/python/heston_fourier.py'
      - '.github/workflows/heston-fourier.yml'

permissions:
  contents: read

concurrency:
  group: heston-fourier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent reference solvers
        run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'mpmath>=1.3,<2'
      - name: Check retained continuous-time references and corruption guards
        run: |
          python scripts/check_heston_fourier_reference.py
          python -m unittest discover -s scripts -p 'test_heston_fourier_reference.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Complex arithmetic and fast Fourier contracts
        run: |
          cargo test --locked -p pricing-numerics
          cargo test --locked -p pricing --test heston_fourier
          cargo test --locked --no-default-features -p pricing --test heston_fourier
      - name: Continuous-time transform and price reference panel
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_fourier -- --include-ignored --nocapture
          } 2>&1 | tee heston-fourier.log
      - name: Retain Fourier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-fourier-${{ matrix.os }}
          path: heston-fourier.log
          retention-days: 14
          if-no-files-found: error
