name: Stochastic dividend Hull-White validation
on:
  push:
    branches: [work/stochastic-dividend-hw-20260924]
    paths: [.github/workflows/stochastic-dividend-hw-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct typed chunks and retain exact source
        run: |
          test "$(git rev-parse HEAD^)" = ef3cf07987ba7c0887970555f6d1b346942a486c
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/pricing/src/engine/processes/stochastic_dividends/hull_white.rs')
          s = p.read_text()
          assert s.count('normals.chunks_exact(4)') == 1
          p.write_text(s.replace('normals.chunks_exact(4)', 'normals.as_chunks::<4>().0.iter()'))
          p = Path('crates/pricing/tests/stochastic_dividend_hull_white.rs')
          s = p.read_text()
          assert s.count('z.chunks_exact(4)') == 1
          p.write_text(s.replace('z.chunks_exact(4)', 'z.as_chunks::<4>().0.iter()').replace('let a = 0.4;', 'let a: f64 = 0.4;'))
          PY
          git rm .github/workflows/stochastic-dividend-hw-build.yml
          git add -u
          test "$(git write-tree)" = a8ad2153867dec2b895fbba0f5883625d9215055
          cargo fmt --all
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use typed chunks and explicit reference float type without changing arithmetic'
          mkdir -p /tmp/hw-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/hw-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/hw-evidence/source.tar.gz HEAD
          git push origin HEAD:refs/heads/work/stochastic-dividend-hw-20260924
      - name: Formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/hw-evidence/clippy.log
      - name: Conditional claims and public Hull-White dividend prices
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::hull_white -- --nocapture 2>&1 | tee /tmp/hw-evidence/claims.log
          cargo test --locked --release -p pricing --test stochastic_dividend_hull_white -- --nocapture 2>&1 | tee /tmp/hw-evidence/hw-prices.log
          cargo test --locked --release -p pricing --test rough_dividend_correlation_risk --test rough_dividend_risk --test rough_dividends --test stochastic_dividend_gamma --test stochastic_dividend_risk --test stochastic_dividend_bergomi_risk --test stochastic_dividend_correlation_risk --test stochastic_dividends --test bergomi_dividends 2>&1 | tee /tmp/hw-evidence/regression.log
      - name: Python wheel and all Python tests
        run: |
          python -m pip install 'maturin>=1.9,<2.0' 'numpy>=2.0,<3.0'
          python -m maturin build --locked --release --out /tmp/hw-wheels
          python -m pip install --force-reinstall /tmp/hw-wheels/*.whl
          python -m unittest discover -s tests/python -p test_stochastic_dividend_hull_white.py -v 2>&1 | tee /tmp/hw-evidence/hw-python.log
          python examples/python/stochastic_dividend_hull_white.py 2>&1 | tee /tmp/hw-evidence/example.log
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/hw-evidence/python-all.log
      - name: Source and documentation contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/hw-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Ordinary release Rust suites
        run: |
          cargo test --locked --release --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/hw-evidence/rust-all.log
          cargo test --locked --release -p pricing-python 2>&1 | tee /tmp/hw-evidence/bindings.log
          cargo test --locked --release -p pricing --no-default-features 2>&1 | tee /tmp/hw-evidence/rust-minimal.log
      - name: Retain source and observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-dividend-hull-white-candidate
          path: /tmp/hw-evidence
          retention-days: 14
          if-no-files-found: warn
