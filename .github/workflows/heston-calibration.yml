name: Heston Fourier calibration

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/**'
      - 'scripts/*heston_calibration*.py'
      - 'scripts/smoke_test_wheel.py'
      - 'scripts/check_source_archive.py'
      - 'tests/python/test_heston_calibration.py'
      - 'examples/python/heston_calibration.py'
      - 'docs/models/heston-calibration.md'
      - 'design/validation/heston-calibration.md'
      - 'rust_pricing.pyi'
      - '.github/workflows/heston-calibration.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: heston-calibration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'mpmath>=1.3,<2' 'maturin>=1.9,<2'
      - name: Check independent Markov targets and retained protocol
        run: |
          python scripts/check_heston_fourier.py
          python scripts/check_heston_calibration_protocol.py
          python -m unittest discover -s scripts -p 'test_heston_calibration_protocol.py'
      - name: Build and install Python API
        run: |
          python -m maturin build --release --locked --out wheelhouse
          python -m pip install wheelhouse/*.whl
      - name: Compare independent optimizer on shared pricing objective
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_heston_calibration_solvers.py 2>&1 | tee heston-calibration-solvers.log
      - name: Retain optimizer comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-calibration-solvers
          path: heston-calibration-solvers.log
          retention-days: 14
          if-no-files-found: error
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check generic optimizer and financial contracts
        run: |
          cargo test --locked -p pricing-numerics
          cargo test --locked -p pricing --test heston_calibration
          cargo test --locked --no-default-features -p pricing --test heston_calibration
      - name: Execute numerical calibration and repricing panels
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_calibration -- --include-ignored --nocapture
          } 2>&1 | tee heston-calibration.log
      - name: Retain calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-calibration-${{ matrix.os }}
          path: heston-calibration.log
          retention-days: 14
          if-no-files-found: error
