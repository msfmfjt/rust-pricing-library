name: Heston LSV recalibrated parameter risk
on:
  pull_request:
    paths:
      - 'crates/**'
      - '**/*heston_lsv_parameter*'
      - '**/heston-lsv-parameter-risk.md'
      - 'rust_pricing.pyi'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - '.github/workflows/heston-lsv-parameter-risk.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: heston-lsv-parameter-risk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_heston_lsv_parameter_contract.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p pricing --test heston_lsv_parameter_risk
      - run: cargo test --locked --no-default-features -p pricing --test heston_lsv_parameter_risk
      - run: cargo test --locked -p pricing --lib total_scramble_errors_preserve_direct_calibration_covariance
      - name: Check independent Black and fixed-target cancellation limits
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_lsv_parameter_risk -- --include-ignored --nocapture
          } 2>&1 | tee heston-lsv-parameter-risk.log
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-lsv-parameter-risk-${{ matrix.os }}
          path: heston-lsv-parameter-risk.log
          retention-days: 14
          if-no-files-found: error
