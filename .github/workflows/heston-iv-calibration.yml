name: Heston Black IV and SSVI calibration
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/**'
      - 'scripts/*heston_iv_calibration*.py'
      - 'scripts/smoke_test_wheel.py'
      - 'scripts/check_source_archive.py'
      - 'tests/python/test_heston_iv_calibration.py'
      - 'examples/python/heston_iv_calibration.py'
      - 'docs/models/heston-iv-calibration.md'
      - 'design/validation/heston-iv-calibration.md'
      - 'rust_pricing.pyi'
      - '.github/workflows/heston-iv-calibration.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: heston-iv-calibration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'mpmath>=1.3,<2'
      - name: Independent Black and SSVI targets and protocol guards
        run: |
          python scripts/check_heston_iv_calibration.py
          python -m unittest discover -s scripts -p 'test_heston_iv_calibration_reference.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: IV input and Jacobian contracts
        run: |
          cargo test --locked -p pricing --lib black_
          cargo test --locked -p pricing --test heston_iv_calibration
          cargo test --locked --no-default-features -p pricing --test heston_iv_calibration
      - name: Exact-IV fits and SSVI target repricing
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_iv_calibration -- --include-ignored --nocapture
          } 2>&1 | tee heston-iv-calibration.log
      - name: Retain IV calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-iv-calibration-${{ matrix.os }}
          path: heston-iv-calibration.log
          retention-days: 14
          if-no-files-found: error
