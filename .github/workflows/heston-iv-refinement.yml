name: Heston IV grid refinement

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/iv-*.json'
      - 'scripts/*heston_iv*py'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - 'tests/python/test_heston_iv_refinement.py'
      - 'examples/python/heston_iv_refinement.py'
      - 'docs/models/heston-iv-refinement.md'
      - 'design/validation/heston-iv-refinement.md'
      - 'rust_pricing.pyi'
      - '.github/workflows/heston-iv-refinement.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: heston-iv-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2'
      - name: Check fixed references, protocol and evidence guards
        run: |
          python scripts/check_heston_iv_calibration.py
          python -m unittest discover -s scripts -p 'test_heston_iv_refinement_protocol.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p pricing --test heston_iv_refinement
      - run: cargo test --locked --no-default-features -p pricing --test heston_iv_refinement
      - name: Execute finite-grid and staged numerical tests in release
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test heston_iv_refinement -- --include-ignored --nocapture
          } 2>&1 | tee heston-iv-refinement.log
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heston-iv-refinement-${{ matrix.os }}
          path: heston-iv-refinement.log
          retention-days: 14
          if-no-files-found: error
