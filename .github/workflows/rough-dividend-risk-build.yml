name: Rough stochastic-dividend risk validation
on:
  push:
    branches: [work/rough-dividend-risk-20260924]
    paths: [.github/workflows/rough-dividend-risk-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited stencil diagnostic and retain exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = cfaafef3f8df7457abe688dd65489454bbe76bd7
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/msfmfjt/rust-pricing-library/git/blobs/2f08d3c69e335edc6eda050a7b460a0d78c93d68', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              encoded = base64.b64decode(json.load(response)['content'])
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '82dc089e60b68545ef50de89ef844627e7b35148af2cbf448655b10e8e427aa2'
          pathlib.Path('/tmp/rough-risk-fix.patch').write_bytes(patch)
          PY
          git apply --index /tmp/rough-risk-fix.patch
          git rm .github/workflows/rough-dividend-risk-build.yml
          test "$(git write-tree)" = 8dbbed3213653aa4c118897eee3e7b3bbadcdfdc
          cargo fmt --all
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: measure call hinge remainder separately from pointwise AAD'
          mkdir -p /tmp/rough-risk-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/rough-risk-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/rough-risk-evidence/source.tar.gz HEAD
          git diff 7945a96393ba0c0ddfb4d58ef3463133927a6a7c HEAD --binary --full-index > /tmp/rough-risk-evidence/change.patch
          git push origin HEAD:refs/heads/work/rough-dividend-risk-20260924
      - name: Formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/rough-risk-evidence/clippy.log
      - name: Rough history reverse and public AAD Gamma tests
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::rough -- --nocapture 2>&1 | tee /tmp/rough-risk-evidence/coefficients.log
          cargo test --locked --release -p pricing --test rough_dividend_risk -- --nocapture 2>&1 | tee /tmp/rough-risk-evidence/rough-risk.log
          cargo test --locked --release -p pricing --test rough_dividends --test stochastic_dividend_gamma --test stochastic_dividend_risk --test stochastic_dividend_bergomi_risk --test stochastic_dividend_correlation_risk --test stochastic_dividends --test bergomi_dividends 2>&1 | tee /tmp/rough-risk-evidence/regression.log
      - name: Wheel and all Python tests
        run: |
          python -m pip install 'maturin>=1.9,<2' 'numpy>=2,<3'
          python -m maturin build --locked --release --out /tmp/rough-risk-wheels
          python -m pip install --force-reinstall /tmp/rough-risk-wheels/*.whl
          python -m unittest discover -s tests/python -p test_rough_dividend_risk.py -v 2>&1 | tee /tmp/rough-risk-evidence/python-risk.log
          python examples/python/rough_dividend_risk.py 2>&1 | tee /tmp/rough-risk-evidence/example.log
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/rough-risk-evidence/python-all.log
      - name: Source and documentation contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/rough-risk-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Ordinary release Rust suites
        run: |
          cargo test --locked --release --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/rough-risk-evidence/rust-all.log
          cargo test --locked --release -p pricing-python 2>&1 | tee /tmp/rough-risk-evidence/bindings.log
          cargo test --locked --release -p pricing --no-default-features 2>&1 | tee /tmp/rough-risk-evidence/rust-minimal.log
      - name: Retain exact source and observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-stochastic-dividend-risk-candidate
          path: /tmp/rough-risk-evidence
          retention-days: 14
          if-no-files-found: warn
