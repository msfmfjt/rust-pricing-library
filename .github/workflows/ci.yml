name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V
          git hash-object Cargo.lock

      - name: Check Local Volatility equation fixture
        run: python scripts/check_local_vol_reference_fixture.py

      - name: Check JSON schemas
        run: python scripts/check_schemas.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: |
          cargo test --locked --workspace --all-features --exclude pricing-python
          cargo test --locked -p pricing-python

      - name: Run statistical acceptance
        run: cargo test --locked -p pricing --test statistical_acceptance -- --ignored --nocapture

      - name: Build Python wheel
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip install "maturin>=1.9,<2.0" "numpy>=2.0,<3.0"
          python -m maturin build --locked --release --out dist
          python -m pip install dist/*.whl

      - name: Smoke-test Python API
        if: matrix.os == 'ubuntu-24.04'
        run: python -m unittest discover -s tests/python -v

      - name: Check dependency direction
        shell: bash
        run: cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py

  supported-wheels:
    name: Wheel / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify native target
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -vV
          rustc -vV | grep "host: ${{ matrix.target }}"

      - name: Build private wheel
        run: |
          python -m pip install "maturin>=1.9,<2.0"
          python -m maturin build --locked --release --out dist

      - name: Build Rust source package
        shell: bash
        run: git archive --format=tar.gz --output "dist/rust-pricing-source-${{ matrix.target }}.tar.gz" HEAD

      - name: Test wheel in clean environment
        run: python scripts/smoke_test_wheel.py

      - name: Run baseline benchmarks
        run: python scripts/run_benchmark_suite.py

      - name: Retain private wheel
        uses: actions/upload-artifact@v4
        with:
          name: rust-pricing-${{ matrix.target }}-cp312
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Retain Rust source package
        uses: actions/upload-artifact@v4
        with:
          name: rust-pricing-source-${{ matrix.target }}
          path: dist/rust-pricing-source-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Retain benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.target }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 14
