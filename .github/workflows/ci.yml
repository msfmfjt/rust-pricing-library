name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-boundaries:
    name: Model boundary comparison / Linux
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/model-extension-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Check out pre-extraction baseline
        uses: actions/checkout@v4
        with:
          ref: 738c020180b343a229ee20aa5acc236dbcd11d88
          path: baseline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install heap profiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind time
      - name: Compare static model boundaries
        working-directory: candidate
        run: python scripts/compare_model_boundaries.py ../baseline . ../model-boundary-results
      - name: Retain paired model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-boundary-comparison-linux
          path: |
            model-boundary-results/comparison.json
            model-boundary-results/*.dhat.json
            model-boundary-results/*.dhat.log
          if-no-files-found: error
          retention-days: 30

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V
          git hash-object Cargo.lock

      - name: Check Local Volatility equation fixture
        run: python scripts/check_local_vol_reference_fixture.py

      - name: Check Path Dependence reference fixture
        run: python scripts/check_path_dependence_reference_fixture.py

      - name: Check Early Exercise reference fixture
        run: python scripts/check_early_exercise_reference_fixture.py

      - name: Check JSON schemas
        run: python scripts/check_schemas.py

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check default and minimal feature configurations
        run: |
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace
          cargo test --locked -p pricing --no-default-features
          cargo test --locked -p pricing-numerics

      - name: Run tests
        run: |
          cargo test --locked --workspace --all-features --exclude pricing-python
          cargo test --locked -p pricing-python

      - name: Run statistical acceptance
        run: |
          cargo test --locked -p pricing --test statistical_acceptance -- --ignored --nocapture
          cargo test --locked -p pricing --test path_dependence_acceptance -- --ignored --nocapture
          cargo test --locked -p pricing --test early_exercise_acceptance -- --ignored --nocapture

      - name: Build Rust API docs
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Run extended model risk acceptance
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test extended_risk_acceptance -- --ignored --nocapture --test-threads=1
          } 2>&1 | tee extended-model-risk.log

      - name: Retain extended model risk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-model-risk-${{ matrix.os }}
          path: extended-model-risk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run extended model accuracy acceptance
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test extended_model_acceptance -- --ignored --nocapture --test-threads=1
          } 2>&1 | tee extended-model-accuracy.log

      - name: Retain extended model accuracy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-model-accuracy-${{ matrix.os }}
          path: extended-model-accuracy.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build Python wheel
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip install "maturin>=1.9,<2.0" "numpy>=2.0,<3.0"
          python -m maturin build --locked --release --out dist

      - name: Smoke-test Python API
        if: matrix.os == 'ubuntu-24.04'
        run: python scripts/smoke_test_wheel.py

      - name: Check dependency direction
        shell: bash
        run: cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py

  supported-wheels:
    name: Wheel / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify native target
        shell: bash
        run: |
          rustup show active-toolchain
          rustc -vV
          rustc -vV | grep "host: ${{ matrix.target }}"

      - name: Build private wheel
        run: |
          python -m pip install "maturin>=1.9,<2.0"
          python -m maturin build --locked --release --out dist

      - name: Build Rust source package
        shell: bash
        run: git archive --format=tar.gz --output "dist/rust-pricing-source-${{ matrix.target }}.tar.gz" HEAD

      - name: Check Rust source package
        run: python scripts/check_source_archive.py "dist/rust-pricing-source-${{ matrix.target }}.tar.gz"

      - name: Test wheel in clean environment
        run: python scripts/smoke_test_wheel.py

      - name: Run baseline benchmarks
        run: python scripts/run_benchmark_suite.py

      - name: Retain replay candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: replay-candidate-${{ matrix.target }}
          path: benchmark-results/*-replay.json
          if-no-files-found: error
          retention-days: 14

      - name: Check replay fixtures
        run: |
          python scripts/check_replay_fixture.py benchmark-results/replay.json
          python scripts/check_replay_fixture.py benchmark-results/local-volatility-replay.json

      - name: Check Path Dependence replay fixture
        run: python scripts/check_replay_fixture.py benchmark-results/path-dependence-replay.json

      - name: Check Early Exercise replay fixture
        run: python scripts/check_replay_fixture.py benchmark-results/early-exercise-replay.json

      - name: Check benchmark artifacts
        run: python scripts/check_benchmark_reports.py benchmark-results

      - name: Retain private wheel
        uses: actions/upload-artifact@v4
        with:
          name: rust-pricing-${{ matrix.target }}-cp312
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Retain Rust source package
        uses: actions/upload-artifact@v4
        with:
          name: rust-pricing-source-${{ matrix.target }}
          path: dist/rust-pricing-source-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Retain benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.target }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 14
