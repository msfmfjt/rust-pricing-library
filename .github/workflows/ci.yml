name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V
          git hash-object Cargo.lock

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: |
          cargo test --locked --workspace --all-features --exclude pricing-python
          cargo test --locked -p pricing-python

      - name: Build Python wheel
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip install "maturin>=1.9,<2.0" "numpy>=2.0,<3.0"
          python -m maturin build --locked --release --out dist
          python -m pip install dist/*.whl

      - name: Smoke-test Python API
        if: matrix.os == 'ubuntu-24.04'
        run: python -m unittest discover -s tests/python -v

      - name: Check dependency direction
        shell: bash
        run: cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
