name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
          cargo -V
          git hash-object Cargo.lock

      - name: Refresh lockfile for dependency review
        shell: bash
        run: |
          cargo generate-lockfile
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "LOCK_BASE64=$(base64 -w0 Cargo.lock)"
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Check dependency direction
        shell: bash
        run: cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
