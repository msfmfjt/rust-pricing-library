name: Native allocator isolation

# Diagnostic branch only: no production acceptance jobs are replaced on main or PR 193.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-allocator-isolation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  allocator-dispatch:
    name: Standalone allocator and dispatch / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - name: Build the standalone C diagnostic
        run: |
          mkdir -p allocator-reports
          xcrun clang -std=c11 -O2 -g -Wall -Wextra -Werror -fno-builtin-malloc -fno-builtin-free -fno-builtin-realloc -pthread -c scripts/diagnostics/allocator_dispatch_probe.c -o allocator-reports/allocator_dispatch_probe.o
          xcrun clang -g -pthread allocator-reports/allocator_dispatch_probe.o -o allocator-reports/allocator-dispatch-probe
          xcrun dsymutil allocator-reports/allocator-dispatch-probe -o allocator-reports/allocator-dispatch-probe.dSYM
      - name: Run one bounded allocation and dispatch experiment
        run: python scripts/diagnostics/run_allocator_dispatch_probe.py --report-directory allocator-reports --workers 4 --seconds 90 --tasks 256 --idle-seconds 10 2>&1 | tee allocator-run.log
      - name: Preserve first-stop and allocation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-allocator-dispatch-${{ matrix.os }}
          path: |
            allocator-reports/
            allocator-run.log
          if-no-files-found: error
          retention-days: 14
