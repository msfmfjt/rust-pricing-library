name: Lifted Heston factor prices

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/rough-volatility/**'
      - 'scripts/check_lifted_heston_factors.py'
      - 'scripts/test_lifted_heston_factors.py'
      - 'scripts/check_source_archive.py'
      - 'design/validation/lifted-heston-factor-prices.md'
      - '.github/workflows/lifted-heston-factors.yml'

permissions:
  contents: read

concurrency:
  group: lifted-heston-factors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent integration dependencies
        run: python -m pip install 'scipy>=1.14,<2'
      - name: Check fixed references and validation gates
        run: |
          python scripts/check_lifted_heston_factors.py
          python -m unittest discover -s scripts -p 'test_lifted_heston_factors.py'
  prices:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check factor elimination and public estimates
        run: cargo test --locked -p pricing --test lifted_heston_factor_prices
      - name: Check minimal-feature factor elimination
        run: cargo test --locked --no-default-features -p pricing --test lifted_heston_factor_prices
      - name: Execute numerical factor-price and forward-moment panel
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test lifted_heston_factor_prices -- --include-ignored --nocapture
          } 2>&1 | tee lifted-heston-factor-prices.log
      - name: Retain factor-price evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifted-heston-factor-prices-${{ matrix.os }}
          path: lifted-heston-factor-prices.log
          retention-days: 14
          if-no-files-found: error
