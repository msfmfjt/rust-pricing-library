name: Dividend regression

on:
  pull_request:
    paths:
      - 'crates/pricing/**'
      - 'crates/pricing-python/**'
      - 'tests/python/**'
      - '.github/workflows/dividends.yml'

permissions:
  contents: read

concurrency:
  group: dividends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Affine observation and carry unit tests
        run: cargo test --locked -p pricing --lib affine -- --nocapture
      - name: Affine public API, AAD and recalibrated VegaKT
        if: ${{ !cancelled() }}
        run: cargo test --locked -p pricing --test hull_white_affine -- --nocapture
      - name: Formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      - name: Capture formatting diagnostics
        if: failure()
        run: |
          cargo fmt --all
          git diff > formatting.patch
          tar -czf formatted-pricing-source.tar.gz crates
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dividend-regression-diagnostics
          path: |
            formatting.patch
            formatted-pricing-source.tar.gz
          retention-days: 3
