name: Stochastic dividend correlation risk validation
on:
  push:
    branches: [work/stochastic-dividend-correlation-20260924]
    paths: [.github/workflows/stochastic-dividend-correlation-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct lint and retain exact source
        run: |
          test "$(git rev-parse HEAD^)" = 4b38320a01a745e19cbdf87ee04a10de2bb49a9a
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/pricing/src/engine/processes/stochastic_dividends/bergomi/correlation_reverse.rs')
          s = p.read_text()
          pairs = [
              ('for j in 0..D {\n                    let exposure: f64', 'for (j, _) in s.lower[0].iter().enumerate() {\n                    let exposure: f64'),
              ('for m in 0..2 {', 'for (m, row) in tangent[p].iter().enumerate() {'),
              ('for n in 0..4 {', 'for (n, &value) in row.iter().enumerate() {'),
              ('(tangent[p][m][n] - fd)', '(value - fd)'),
              ('"k={k:?}, dt={dt}, p={p}, ({m},{n}), aad={}, fd={fd}",\n                                    tangent[p][m][n]', '"k={k:?}, dt={dt}, p={p}, ({m},{n}), aad={value}, fd={fd}"'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/stochastic-dividend-correlation-build.yml
          cargo fmt --all
          git add -u
          test "$(git write-tree)" = ef7b985dab4af3de556884d48d60b063eb2114a1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: iterate correlation coefficient rows without changing arithmetic'
          mkdir -p /tmp/correlation-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/correlation-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/correlation-evidence/source.tar.gz HEAD
          git push origin HEAD:refs/heads/work/stochastic-dividend-correlation-20260924
      - name: Formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/correlation-evidence/clippy.log
      - name: Correlation coefficients and public risk tests
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::bergomi::correlation_reverse -- --nocapture 2>&1 | tee /tmp/correlation-evidence/coefficients.log
          cargo test --locked --release -p pricing --test stochastic_dividend_correlation_risk -- --nocapture 2>&1 | tee /tmp/correlation-evidence/correlation-risk.log
          cargo test --locked --release -p pricing --test stochastic_dividend_bergomi_risk --test stochastic_dividend_risk --test bergomi_dividends --test stochastic_dividends 2>&1 | tee /tmp/correlation-evidence/regression.log
      - name: Wheel and all Python tests
        run: |
          python -m pip install 'maturin>=1.9,<2' 'numpy>=2,<3'
          python -m maturin build --locked --release --out /tmp/correlation-wheels
          python -m pip install --force-reinstall /tmp/correlation-wheels/*.whl
          python -m unittest discover -s tests/python -p test_stochastic_dividend_correlation_risk.py -v 2>&1 | tee /tmp/correlation-evidence/python-risk.log
          python examples/python/stochastic_dividend_correlation_risk.py 2>&1 | tee /tmp/correlation-evidence/example.log
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/correlation-evidence/python-all.log
      - name: Source and documentation contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/correlation-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Normal Rust suites in release mode
        run: |
          cargo test --locked --release --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/correlation-evidence/rust-all.log
          cargo test --locked --release -p pricing-python 2>&1 | tee /tmp/correlation-evidence/bindings.log
          cargo test --locked --release -p pricing --no-default-features 2>&1 | tee /tmp/correlation-evidence/rust-minimal.log
      - name: Retain exact source and observed logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stochastic-dividend-correlation-risk-candidate
          path: /tmp/correlation-evidence
          retention-days: 14
          if-no-files-found: warn
