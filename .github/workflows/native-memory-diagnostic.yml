name: PR 206 native allocation histories
on:
  workflow_dispatch:
    inputs:
      selection:
        required: true
        type: choice
        options:
          - put-extension-linear_time-4
          - custom-basis-weighted_time_hats-4-put-fixed_lookback
          - coupled-basis-coupled_row_hats-4-call-arithmetic_asian
env:
  PR206_ADDRESS_COHORT: 1-in-128
permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Verify the ordinary pricing wheel under LLDB
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SELECTION: preflight
    steps: &validation_steps
      - uses: actions/checkout@v7
        with:
          path: diagnostics
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d35cf226e2989482f8a2fec568ae85e02a6b973a
          path: pr
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12.10
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: '13427035678'
          run-id: '42015467907'
          github-token: ${{ github.token }}
          path: pr/dist
          merge-multiple: true
      - name: Verify and run under LLDB
        timeout-minutes: 315
        run: bash diagnostics/tools/pr206/job.sh
      - name: Seal event records
        if: always()
        run: bash diagnostics/tools/pr206/seal.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: events-${{ env.SELECTION }}
          path: evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  validation:
    name: LLDB / ${{ inputs.selection }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 350
    env:
      SELECTION: ${{ inputs.selection }}
    steps: *validation_steps
