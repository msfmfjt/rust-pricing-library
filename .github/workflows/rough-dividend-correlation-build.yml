name: Rough stochastic-dividend correlation risk validation
on:
  push:
    branches: [work/rough-dividend-correlation-risk-20260924]
    paths: [.github/workflows/rough-dividend-correlation-build.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize verified source and retain exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = 509ccdfe65e4dcb09b0c6430b4cacb6475a917f9
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = []
          for sha in ['0c210c97948e1adeb80df84757f271c3bed956b9', '75bbd02bdc5a07282be21d115263b10432bc0014', 'ff70fd1a02774a83cf5f02efebb43414695db0f8']:
              request = urllib.request.Request('https://api.github.com/repos/msfmfjt/rust-pricing-library/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  parts.append(base64.b64decode(json.load(response)['content']))
          patch = lzma.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ac691ed11ac515acd598fcffae21ef626dba066819cfa7a0932dd89bad8555c8'
          pathlib.Path('/tmp/rough-correlation.patch').write_bytes(patch)
          PY
          git apply --index /tmp/rough-correlation.patch
          git rm .github/workflows/rough-dividend-correlation-build.yml
          test "$(git write-tree)" = 1ee01887dc442972027f67d9751bc6fe343d295c
          cargo fmt --all
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: materialize formatted rough stochastic-dividend correlation risk'
          mkdir -p /tmp/rough-correlation-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; rustc -vV; cargo -V; } | tee /tmp/rough-correlation-evidence/revision.txt
          git archive --format=tar.gz -o /tmp/rough-correlation-evidence/source.tar.gz HEAD
          git diff 509ccdfe65e4dcb09b0c6430b4cacb6475a917f9 HEAD --binary --full-index > /tmp/rough-correlation-evidence/change.patch
          git push origin HEAD:refs/heads/work/rough-dividend-correlation-risk-20260924
      - name: Formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/rough-correlation-evidence/clippy.log
      - name: Rough correlation transpose and public risk tests
        run: |
          cargo test --locked --release -p pricing --lib engine::processes::stochastic_dividends::rough -- --nocapture 2>&1 | tee /tmp/rough-correlation-evidence/coefficients.log
          cargo test --locked --release -p pricing --test rough_dividend_correlation_risk -- --nocapture 2>&1 | tee /tmp/rough-correlation-evidence/correlation-risk.log
          cargo test --locked --release -p pricing --test rough_dividend_risk --test rough_dividends --test stochastic_dividend_gamma --test stochastic_dividend_risk --test stochastic_dividend_bergomi_risk --test stochastic_dividend_correlation_risk --test stochastic_dividends --test bergomi_dividends 2>&1 | tee /tmp/rough-correlation-evidence/regression.log
      - name: Wheel and all Python tests
        run: |
          python -m pip install 'maturin>=1.9,<2' 'numpy>=2,<3'
          python -m maturin build --locked --release --out /tmp/rough-correlation-wheels
          python -m pip install --force-reinstall /tmp/rough-correlation-wheels/*.whl
          python -m unittest discover -s tests/python -p test_rough_dividend_correlation_risk.py -v 2>&1 | tee /tmp/rough-correlation-evidence/python-correlation.log
          python examples/python/rough_dividend_correlation_risk.py 2>&1 | tee /tmp/rough-correlation-evidence/example.log
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/rough-correlation-evidence/python-all.log
      - name: Source and documentation contracts
        run: |
          python scripts/check_local_vol_reference_fixture.py
          python scripts/check_path_dependence_reference_fixture.py
          python scripts/check_early_exercise_reference_fixture.py
          python scripts/check_schemas.py
          python scripts/check_markdown_links.py
          python scripts/check_source_archive.py /tmp/rough-correlation-evidence/source.tar.gz
          python - <<'PY'
          import ast, pathlib, runpy
          runpy.run_path('scripts/smoke_test_wheel.py')['verify_stub_static_shape'](ast.parse(pathlib.Path('rust_pricing.pyi').read_text()))
          PY
          cargo doc --locked --workspace --all-features --no-deps
          cargo metadata --locked --format-version 1 --no-deps | python scripts/check_dependency_direction.py
      - name: Ordinary release Rust suites
        run: |
          cargo test --locked --release --workspace --all-features --exclude pricing-python 2>&1 | tee /tmp/rough-correlation-evidence/rust-all.log
          cargo test --locked --release -p pricing-python 2>&1 | tee /tmp/rough-correlation-evidence/bindings.log
          cargo test --locked --release -p pricing --no-default-features 2>&1 | tee /tmp/rough-correlation-evidence/rust-minimal.log
      - name: Retain exact source and observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-stochastic-dividend-correlation-risk-candidate
          path: /tmp/rough-correlation-evidence
          retention-days: 14
          if-no-files-found: warn
