name: Mixed rough Bergomi parameter reverse
on:
  pull_request:
    paths:
      - 'crates/**'
      - '**/*mixed_bergomi_parameter*'
      - '**/mixed-bergomi-parameter-risk.md'
      - 'fixtures/rough-volatility/mixed-parameter.json'
      - 'rust_pricing.pyi'
      - 'scripts/check_source_archive.py'
      - 'scripts/smoke_test_wheel.py'
      - '.github/workflows/mixed-bergomi-parameter-risk.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mixed-bergomi-parameter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3'
      - run: python scripts/check_mixed_bergomi_parameter_reference.py
      - run: python -m unittest discover -s scripts -p 'test_mixed_bergomi_parameter_contract.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p pricing --test mixed_bergomi_parameter_risk
      - run: cargo test --locked --no-default-features -p pricing --test mixed_bergomi_parameter_risk
      - run: cargo test --locked -p pricing --lib mixed_total_scramble_errors_preserve_direct_calibration_covariance
      - name: Independent two-step expectation and finite derivative controls
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc -vV
            cargo test --locked --release -p pricing --test mixed_bergomi_parameter_risk -- --include-ignored --nocapture
          } 2>&1 | tee mixed-bergomi-parameter-risk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-bergomi-parameter-risk-${{ matrix.os }}
          path: mixed-bergomi-parameter-risk.log
          if-no-files-found: error
          retention-days: 14
