[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "rust-pricing"
description = "Deterministic Rust and Python derivatives-pricing library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Masafumi Fujita" }]
dynamic = ["version"]

[tool.maturin]
manifest-path = "crates/pricing-python/Cargo.toml"
features = ["extension-module"]
module-name = "rust_pricing"
